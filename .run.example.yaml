log_level: INFO
camera_index: 0
flip_camera: true
target_fps: 30
frame_width: 1280
frame_height: 960
render_position_sensitivity: 1.0
debug_stats: true
motion_preset: medium
aggressive_release_guard: false

# Virtual hand configuration
virtual_hand:
  # Coordinate scaling factor
  scale: 4.0
  # Depth scaling factor
  depth_scale: 8.0
  # Debounce threshold (number of frames)
  stable_threshold: 3
  # Bone color (RGB, 0-1)
  bone_color: [1.0, 0.0, 0.0]  # Orange
  # Bone line width
  bone_width: 2.0